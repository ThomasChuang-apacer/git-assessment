<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="git-assessment-token" content="{{ api_token }}">
  <meta name="git-assessment-instance" content="{{ instance_id }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230369a1'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' font-family='Consolas,monospace' font-size='38' font-weight='800' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <title>{% block title %}Git 實作測驗{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要內容</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.home') }}" aria-label="Git 實作測驗首頁">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>Git 實作測驗</span>
    </a>
    <div class="header-actions">
      {% block header_action %}{% endblock %}
      <a class="header-link header-examiner" href="{{ url_for('main.examiner_dashboard') }}">考官模式</a>
      <button class="shutdown-button" type="button" id="shutdown-app" aria-label="安全關閉 Git Assessment" title="停止本機伺服器（所有測驗進度會自動保存，不會遺失）">
        <span class="shutdown-dot" aria-hidden="true"></span>
        <span class="shutdown-label-full">安全關閉 Git Assessment</span>
        <span class="shutdown-label-short" aria-hidden="true">安全關閉</span>
      </button>
    </div>
  </header>
  <main class="page-shell" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <section class="shutdown-screen" id="shutdown-screen" hidden aria-live="polite">
    <div class="shutdown-card">
      <span class="shutdown-check" aria-hidden="true">✓</span>
      <p class="eyebrow">SAFE SHUTDOWN</p>
      <h1>已安全關閉 Git Assessment</h1>
      <p>測驗進度已保存，現在可以關閉此頁。</p>
    </div>
  </section>
  <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <form method="dialog" class="confirm-panel">
      <h2 id="confirm-dialog-title"></h2>
      <p id="confirm-dialog-message"></p>
      <div class="confirm-actions">
        <button class="button button-secondary" type="submit" value="cancel" id="confirm-dialog-cancel">取消</button>
        <button class="button button-primary" type="submit" value="confirm" id="confirm-dialog-ok">確定</button>
      </div>
    </form>
  </dialog>
  <div class="visually-hidden" id="live-region" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
