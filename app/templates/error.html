{% extends "base.html" %}
{% block title %}發生問題｜Git 實作測驗{% endblock %}
{% block content %}
<section class="error-card">
  <span class="error-code" aria-hidden="true">!</span>
  <p class="eyebrow">UNABLE TO CONTINUE</p>
  <h1>{{ message }}</h1>
  <p>請返回首頁重新操作，或確認網址是否正確。</p>
  <a class="button button-primary" href="{{ url_for('main.home') }}">返回首頁</a>
</section>
{% endblock %}
